<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZOOL 401 – Invertebrate Zoology</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="learning-mode">

  <!-- Mode Toggle -->
  <div id="mode-toggle-container">
    <span class="mode-label" id="label-learning">Learning</span>
    <label class="toggle-switch" aria-label="Switch between Learning and Testing mode">
      <input type="checkbox" id="mode-toggle" />
      <span class="slider"></span>
    </label>
    <span class="mode-label" id="label-testing">Testing</span>
  </div>

  <!-- Page Header -->
  <header id="site-header">
    <div class="header-titles">
      <h1>ZOOL 401</h1>
      <h2>Invertebrate Zoology</h2>
    </div>
    <p id="mode-indicator">Learning Mode</p>
  </header>
  <button id="header-toggle" aria-label="Collapse header" title="Collapse header">▲</button>

  <main>

    <!-- Cladistics Tree -->
    <section id="cladistics-section">
      <div class="section-title-row">
        <h2 class="section-title">Cladistics Tree</h2>
        <button id="tree-fullscreen-btn" title="Enter fullscreen">&#x26F6;</button>
      </div>
      <div id="cladistics-tree">
        <!-- Tree will be built by script.js -->
      </div>
    </section>

    <!-- Summary Table -->
    <section id="summary-section">
      <h2 class="section-title">Summary Table</h2>
      <div id="summary-table-container">
        <!-- Built dynamically by script.js -->
      </div>
    </section>

    <!-- Topic Sections -->
    <div id="topics-container">
      <!-- Individual topic sections will be added here -->
      <p class="placeholder-text" id="topics-placeholder">Topic sections will appear here as content is added.</p>
    </div>

  </main>

  <footer>
    <p>ZOOL 401 – Invertebrate Zoology Study Guide</p>
  </footer>

  <!-- Check Answer Button (testing mode only) -->
  <button id="check-answer-btn" aria-label="Check Answer">&#10003;</button>

  <script src="script.js"></script>
</body>
</html>
